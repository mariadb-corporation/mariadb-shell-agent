# Installed as .github/actions/pnpm-install by mariadb/rebrand/github.mjs.
name: 'pnpm-install'
description: >-
  Node.js 22 and `pnpm install --frozen-lockfile` (pnpm from the packageManager field, via
  corepack), with pnpm's content-addressable store cached by the lockfile's hash. A lockfile
  change restores the newest older store, so only the changed packages are downloaded. Caches
  saved on main are shared with every pull request; a pull request's own cache stays with it.
inputs:
  build:
    description: >-
      'false' skips the build the root prepare script runs after the install (QWEN_SKIP_PREPARE),
      for jobs that only read sources: about 9 of the install's 10 minutes.
    default: 'true'
runs:
  using: 'composite'
  steps:
    # setup-node's own pnpm cache needs pnpm on the PATH before Node.js is installed; corepack
    # only provides it afterwards, so the store is cached explicitly below.
    - uses: 'actions/setup-node@v7'
      with:
        node-version: '22'
        package-manager-cache: false
    - id: 'store'
      shell: 'bash'
      run: |
        corepack enable
        echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: 'actions/cache@v6'
      with:
        path: '${{ steps.store.outputs.path }}'
        key: "pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
        restore-keys: 'pnpm-store-${{ runner.os }}-'
    - shell: 'bash'
      env:
        QWEN_SKIP_PREPARE: "${{ inputs.build == 'false' && '1' || '' }}"
      run: 'pnpm install --frozen-lockfile'
