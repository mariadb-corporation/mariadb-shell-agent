    <!--
      `interactive-widget=resizes-content` is Chrome-on-Android-only (108+);
      iOS Safari silently ignores it — the virtual keyboard always overlays
      the viewport there. Keyboard-aware layout on iOS requires the
      VirtualKeyboard API or `visualViewport` resize events instead.
    -->

      Status bar color follows the active theme; the inline script below
      updates this meta tag in the same tick it applies the theme class so

    <title>MariaDB Shell Agent Web chat</title>
    <!--
      PWA manifest: makes the Web Shell installable on Android / iOS.
      start_url is intentionally relative ("/") so it resolves against
      whatever daemon origin serves this page — never hard-coded.
      The manifest itself is served by the daemon's static handler at /manifest.webmanifest.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The CSS floor follows Tailwind v4, independently of the ES2021 JS target.
         Keep this guard ES5 so unsupported engines can still show the fallback. -->
    <!-- prettier-ignore -->
    <script>
      !(function () {
        try {
          var ua = navigator.userAgent;
          var chromium = ua.match(/Chrom(?:e|ium)\/(\d+)/);
          var firefox = ua.match(/Firefox\/(\d+)/);
          // Android WebView also carries `Version/4.0 ... Safari/`, but its
          // actual engine version is the Chromium token handled above.
          var safari =
            !chromium && ua.match(/Version\/(\d+)(?:\.(\d+))?.*Safari\//);
          var unsupported =
            (chromium && parseInt(chromium[1], 10) < 111) ||
            (firefox && parseInt(firefox[1], 10) < 128) ||
            (safari &&
              (parseInt(safari[1], 10) < 16 ||
                (parseInt(safari[1], 10) === 16 &&
                  parseInt(safari[2] || '0', 10) < 4)));

            unsupported =
              unsupported ||
              !window.CSS.supports('color', 'oklch(0.5 0.1 90)') ||
              !window.CSS.supports('color', 'color-mix(in srgb, red, blue)') ||
              !window.CSS.supports('height', '100dvh') ||
              !window.CSS.supports('container-type', 'inline-size') ||
              !window.CSS.supports('selector(:has(*))');
          }

              'Please update your browser. MariaDB Shell Agent requires Chrome/Edge or Android System WebView 111+, Firefox 128+, or Safari/iOS 16.4+. / 请更新浏览器：MariaDB Shell Agent 需要 Chrome/Edge 或 Android System WebView 111+、Firefox 128+ 或 Safari/iOS 16.4+。'
            );
          }

          // Unknown engines can try to load; the boot watchdog reports failures.
        }
      })();

      <html> background matches the app theme on mobile. Without this, the

    <!--
      Apply a white-label brand (`ui.brand` in settings.json) before first paint
      so a renamed deployment does not flash the built-in title and logo on every
      load; main.tsx writes the cache, keyed as BRAND_STORAGE_KEY there. Sits
      after the icon <link> on purpose — the script swaps that element's href, so
      running earlier would find nothing to swap. The cached logo is only ever
      assigned to an href, never injected as markup: SVG loaded as an image
      cannot run script, injected SVG can, and the daemon does not sanitize the
      file it read. Kept on one line behind the guard below, and short, because
      it ships verbatim in the built document.
    -->
    <!-- prettier-ignore -->
    <script>
      !function(){try{var b=JSON.parse(localStorage.getItem('qwen-code-web-shell-brand')||'null');if(!b)return;if(b.title)document.title=b.title;if(b.logo){var l=document.querySelector('link[rel="icon"]');if(l)l.href=b.logo}}catch(e){console.warn('brand-init:',e)}}();
    </script>
  </head>
  <body>
    <!--
      Prevent React 19 dev-mode OOM crashes. React records component prop
      details through performance.measure(), which structured-clones and retains
      those details. Strip the detail before large transcripts reach the native
      call while preserving the component timing and non-React measures. The
      stripped entries themselves still accumulate in the browser's unbounded
      user-timing buffer — an idle dev page emits ~16k measures/s — so the
      timeline is also cleared on a budget, or long-lived dev tabs exhaust the
      renderer's PartitionAlloc address space and die with SIGABRT.
    -->
    <script>
      !(function () {
        if (typeof performance === 'undefined' || !performance.measure) return;
        var m = performance.measure.bind(performance);
        var clear =
          typeof performance.clearMeasures === 'function'
            ? performance.clearMeasures.bind(performance)
            : null;
        var reactMeasures = 0;
        var CLEAR_EVERY = 16384;
        performance.measure = function () {
          var options = arguments[1];
          var devtools =
            options &&
            typeof options === 'object' &&
            options.detail &&
            options.detail.devtools;
          if (devtools) {
            reactMeasures += 1;
            if (clear && reactMeasures >= CLEAR_EVERY) {
              reactMeasures = 0;
              clear();
            }
            var args = Array.prototype.slice.call(arguments);
            args[1] = Object.assign({}, options, { detail: null });
            return m.apply(this, args);
          }
          return m.apply(this, arguments);
        };
      })();
    </script>
    <!--
      Boot watchdog: when the app never mounts (a dev-server restart
      invalidating module URLs mid-load, the daemon unreachable, a rotated
      auth token, ...) the page would otherwise stay blank with no error and
      no way to recover. After a grace period — or immediately when a
      script/module resource fails to load — render a visible, theme-aware
      fallback showing the captured errors and a reload action. Errors thrown
      by a booting module are captured too, but surfaced by the grace timer
      rather than immediately, so a burst accumulates in one panel. Kept
      dependency-free ES5 so it runs even if every module import fails.

      This script deliberately runs before #root is parsed, so it is already
      listening while the module graph loads. Everything therefore resolves
      #root lazily, and the mount observer installs on DOMContentLoaded when
      the element does not exist yet — a MutationObserver created here
      against a null root would be silently dropped.

      Invariant: #root must stay empty until React mounts. Mount detection
      keys off "first child that is not the fallback box", so a static child
      (e.g. a boot spinner) would read as mounted and disable the watchdog;
      keep #root empty in index.html. Both terminal states — a real mount,
      or the fallback being rendered — uninstall the watchdog (listeners,
      timer, observer) and release its captured errors, so nothing survives
      a settled boot. The fallback box, once shown, is sticky, so a late
      timer never overwrites a more specific earlier reason.
    -->
    <!-- prettier-ignore -->
    <script>
      !(function () {
        var GRACE_MS = 15000;
        var MAX_ERRORS = 5;
        var errors = [];
        var timer = null;
        var observer = null;
        var pendingInstall = false;
        function rootEl() {
          return document.getElementById('root');
        }
        function fallbackPresent() {
          var r = rootEl();
          return !!(r && r.querySelector('[data-boot-fallback]'));
        }
        function appMounted() {
          var r = rootEl();
          return !!(
            r &&
            r.firstElementChild &&
            !r.firstElementChild.hasAttribute('data-boot-fallback')
          );
        }
        function pushError(msg) {
          if (errors.length < MAX_ERRORS) errors.push(msg);
        }
        function uninstall() {
          if (timer !== null) {
            clearTimeout(timer);
            timer = null;
          }
          if (observer) {
            observer.disconnect();
            observer = null;
          }
          if (pendingInstall) {
            document.removeEventListener('DOMContentLoaded', installObserver);
            pendingInstall = false;
          }
          window.removeEventListener('error', onError, true);
          window.removeEventListener('unhandledrejection', onRejection);
          errors.length = 0;
        }
        function show(reason) {
          var r = rootEl();
          if (!r || appMounted() || fallbackPresent()) return;
          var unsupported = document.documentElement.getAttribute(
            'data-web-shell-unsupported-browser'
          );
          if (unsupported) reason = unsupported;
          var dark = document.documentElement.classList.contains('theme-dark');
          var box = document.createElement('div');
          box.setAttribute('data-boot-fallback', '');
          box.style.cssText =
            'min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;box-sizing:border-box;font-family:system-ui,sans-serif;text-align:center;background:' +
            (dark ? '#0d0d0d' : '#ffffff') +
            ';color:' +
            (dark ? '#e5e5e5' : '#1a1a1a');
          var h = document.createElement('h1');
          h.style.cssText = 'font-size:18px;margin:0';
          h.textContent = document.documentElement.hasAttribute(
            'data-web-shell-unsupported-browser'
          )
            ? 'Browser update required / 请更新浏览器'
            : 'Web Shell 加载失败 / failed to load';
          var p = document.createElement('p');
          p.style.cssText = 'margin:0;font-size:13px;opacity:.75;max-width:560px';
          p.textContent = reason;
          box.appendChild(h);
          box.appendChild(p);
          if (errors.length) {
            var pre = document.createElement('pre');
            pre.style.cssText =
              'margin:0;font-size:11px;opacity:.6;max-width:720px;max-height:160px;overflow:auto;text-align:left;white-space:pre-wrap';
            pre.textContent = errors.join('\n');
            box.appendChild(pre);
          }
          var btn = document.createElement('button');
          btn.textContent = '重新加载 / Reload';
          btn.style.cssText =
            'padding:8px 20px;border-radius:8px;border:1px solid ' +
            (dark ? '#444' : '#ccc') +
            ';background:' +
            (dark ? '#222' : '#f5f5f5') +
            ';color:inherit;font-size:14px;cursor:pointer';
          btn.addEventListener('click', function () {
            location.reload();
          });
          box.appendChild(btn);
          r.textContent = '';
          r.appendChild(box);
          // The box is terminal — it is sticky, and further errors would
          // never reach the panel — so release everything here rather than
          // waiting on a mount that may never come.
          uninstall();
        }
        function onError(e) {
          var t = e && e.target;
          // An inline <script> that throws also targets a SCRIPT element, so
          // require a src/href: only a failed *fetch* proves boot is
          // impossible right now. A favicon is excluded from that proof — it
          // can never be load-bearing for boot, and a white-label deployment
          // points it at an operator-supplied data URI that this script itself
          // swaps in before paint, so a logo the browser refuses to decode
          // must not take the whole shell down with a "reload the page" panel
          // that reloading cannot fix (the cache survives the reload). Its
          // error is also kept out of the panel's list: a bare Event on that
          // element carries no message, so recording it would add a content-free
          // 'unknown error' entry that points the operator at nothing.
          var isIcon = !!(t && t.tagName === 'LINK' && t.rel === 'icon');
          var isResource = !!(
            t &&
            ((t.tagName === 'SCRIPT' && t.src) ||
              (t.tagName === 'LINK' && t.href && !isIcon))
          );
          var msg = (e && e.message) || 'unknown error';
          if (isResource) msg += ' (' + (t.src || t.href) + ')';
          if (!isIcon) pushError(msg);
          if (appMounted()) return;
          // Runtime errors and rejections are captured and surfaced by the
          // grace timer (or by a later resource failure) so a burst of boot
          // errors accumulates in the panel instead of being truncated to
          // the first one.
          if (isResource) {
            show(
              'A required resource failed to load: ' +
                msg +
                '. This usually happens right after a dev-server or daemon restart — reload the page.'
            );
          }
        }
        function onRejection(e) {
          var reason = e && e.reason;
          pushError(
            String((reason && reason.message) || reason || 'unhandled rejection')
          );
        }
        function installObserver() {
          if (pendingInstall) {
            document.removeEventListener('DOMContentLoaded', installObserver);
            pendingInstall = false;
          }
          if (observer) return;
          var root = rootEl();
          if (!root) {
            // #root is parsed after this script; retry once the document is
            // complete. Nothing is lost meanwhile: React cannot have mounted
            // into an element that does not exist yet.
            if (!pendingInstall) {
              pendingInstall = true;
              document.addEventListener('DOMContentLoaded', installObserver);
            }
            return;
          }
          var unsupported = document.documentElement.getAttribute(
            'data-web-shell-unsupported-browser'
          );
          if (unsupported) {
            show(unsupported);
            return;
          }
          // A mount that beat this install would never produce a record.
          if (appMounted()) {
            uninstall();
            return;
          }
          if (typeof MutationObserver === 'undefined') return;
          observer = new MutationObserver(function () {
            if (appMounted()) uninstall();
          });
          observer.observe(root, { childList: true });
        }
        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', onRejection);
        installObserver();
        timer = setTimeout(function () {
          if (!appMounted()) {
            show(
              'The app did not start within ' +
                GRACE_MS / 1000 +
                's. The daemon may be restarting or its access token may have rotated — reload the page.'
            );
          }
          // The grace period is over either way: mounted, fallback shown, or
          // show() declined. Nothing this watchdog can still do is useful.
          uninstall();
        }, GRACE_MS);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
